  <script>
    // 在首帧前恢复主题，避免刷新时闪白或闪黑；没有保存值时跟随系统偏好。
    (() => {
      let stored = null;
      try {
        stored = localStorage.getItem("site-theme");
      } catch (error) {
        stored = null;
      }
      const systemTheme = window.matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "night";
      const themeNames = ["night", "paper", "nocturne", "nocturne-bright"];
      const themeColors = {
        night: "#0b0d14",
        paper: "#f7f4ee",
        nocturne: "#211d25",
        "nocturne-bright": "#fbf8ff"
      };
      const theme = themeNames.includes(stored) ? stored : systemTheme;
      document.documentElement.dataset.theme = theme;
      const themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) themeColor.content = themeColors[theme];
    })();
  </script>
