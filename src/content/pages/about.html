  <h1 class="post-title">suhan</h1>
  <div class="post-body">
    <p>
      悠久的时间啊，不懈行走中的愚蠢的旅人啊；壮烈的火焰啊，将一切化为灰烬的悲哀罪人啊。红色外衣披于身，铭刻此伤永不愈；在纠缠凌乱的锁状牢狱，细数吾之罪。时间，即是罪恶！
    </p>
    <p>
      宣告，汝之身托吾麾下；吾之命运附汝剑上，响应圣杯之召唤，遵从这意志、道理者，回应我！
    </p>
